    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderScript(text, highlights) {
      const sorted = [...highlights].sort((a, b) => a.start - b.start);
      let html = '';
      let cursor = 0;

      for (const h of sorted) {
        const start = Math.max(0, Math.min(h.start, text.length));
        const end = Math.max(start, Math.min(h.end, text.length));
        if (start < cursor) continue;

        html += formatChunk(text.slice(cursor, start));
        const slice = text.slice(start, end);
        const match = slice === h.quote;
        html += `<mark class="${escapeHtml(h.type)}" title="${escapeHtml(h.type)}${match ? '' : ' (offset/quote mismatch)'}">${formatChunk(slice)}</mark>`;
        cursor = end;
      }
      html += formatChunk(text.slice(cursor));
      return html;
    }

    // Keep <b>…</b> chapter headers; escape everything else; preserve newlines via pre-wrap.

        .replace(/&lt;b&gt;/g, '<b>')
