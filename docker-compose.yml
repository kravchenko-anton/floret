# Local Postgres (`db`) for day-to-day `npm run start:dev`.
# App image is independent: pass DATABASE_URL to any hosted Postgres.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floret}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floret}
      POSTGRES_DB: ${POSTGRES_DB:-floret}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - floret_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production-style app: no local db dependency — set DATABASE_URL to your Postgres link.
  app:
    image: antonkravchenko1/floret:latest
    build: .
    restart: unless-stopped
    profiles: [full]
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Postgres connection string}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      DASHSCOPE_MAX_TOKENS: ${DASHSCOPE_MAX_TOKENS:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-pintostudio/youtube-transcript-scraper}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  floret_pg:
